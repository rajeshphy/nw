<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14212d">
  <title>Daily Briefs</title>
  <link rel="stylesheet" href="assets/css/portal.css?v=5">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" id="portal-initials">DB</span>
      <div>
        <h1 id="portal-title">Daily Briefs</h1>
        <p id="today"></p>
      </div>
    </div>

    <div class="actions">
      <button id="refresh" type="button" title="Refresh" aria-label="Refresh">↻</button>
      <a id="external" target="_blank" rel="noopener" title="Open separately" aria-label="Open separately">↗</a>
    </div>

    <nav id="nav" aria-label="News sections"></nav>
  </header>

  <main>
    <section class="meta">
      <div>
        <span class="dot"></span>
        <strong id="section-title">Loading</strong>
        <span class="sep">·</span>
        <span id="post-date"></span>
      </div>
      <span id="badge" class="badge">CHECKING</span>
    </section>

    <section class="viewer">
      <div id="message" class="message">Loading latest available brief…</div>
      <iframe id="frame" title="Daily brief"></iframe>
    </section>
  </main>

  <script src="assets/js/portal.js?v=5"></script>
</body>
</html>
