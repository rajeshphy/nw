portal:
  title: "Daily Briefs"
  timezone: "Asia/Kolkata"
  timezone_label: "IST"
  locale: "en-GB"
  default_source: "pib"

  # All visible interface text is controlled here.
  loading_text: "Loading latest available brief…"
  checking_text: "Checking"
  today_text: "Today"
  not_found_text: "Not found"
  unavailable_text: "Unavailable"
  refresh_label: "Refresh"
  external_label: "Open separately"
  navigation_label: "News sections"
  frame_title: "Daily brief"
  no_post_before: "No individual post was discovered for"
  open_archive_text: "Open its archive"
  data_error_text: "Portal data could not be read. Run the included GitHub Action once."

  # Badge behaviour: "time" shows only the latest fetch time, e.g. 10:00 PM.
  # Other supported values are "label_time" and "label".
  latest_badge_mode: "time"
  latest_label: "Latest"

# Add, remove, rename, disable or reorder menu buttons here.
sources:
  - id: "pib"
    enabled: true
    label: "PIB"
    subtitle: "Government"
    heading: "PIB Brief"
    archive: "https://rajeshphy.github.io/pib/"
    github_repo: "rajeshphy/pib"
    posts_dir: "_posts"
    branch: "main"

  - id: "dmk"
    enabled: true
    label: "DMK"
    subtitle: "Local"
    heading: "Dumka Brief"
    archive: "https://rajeshphy.github.io/dumka-jhar-news/"
    github_repo: "rajeshphy/dumka-jhar-news"
    posts_dir: "docs/_posts"
    branch: "main"

  - id: "pol"
    enabled: true
    label: "POL"
    subtitle: "Politics"
    heading: "Political Brief"
    archive: "https://rajeshphy.github.io/political-news/"
    github_repo: "rajeshphy/political-news"
    posts_dir: "_posts"
    branch: "main"

  - id: "eco"
    enabled: true
    label: "ECO"
    subtitle: "Economy"
    heading: "Economic Brief"
    archive: "https://rajeshphy.github.io/economic-news/"
    github_repo: "rajeshphy/economic-news"
    posts_dir: "_posts"
    branch: "main"

  - id: "phy"
    enabled: true
    label: "PHY"
    subtitle: "Physics"
    heading: "Physics Brief"
    archive: "https://rajeshphy.github.io/physics-news/"
    github_repo: "rajeshphy/physics-news"
    posts_dir: "docs/_posts"
    branch: "main"
