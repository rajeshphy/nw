portal:
  title: "Daily Briefs"
  timezone: "Asia/Kolkata"
  timezone_label: "IST"
  locale: "en-GB"
  default_source: "pib"

  # All visible interface text is controlled here.
  loading_text: "Loading latest available brief…"
  checking_text: "Checking"
  today_text: "Today"
  yesterday_text: "Yesterday"
  link_text: "Link"
  not_found_text: "Not found"
  unavailable_text: "Unavailable"
  refresh_label: "Refresh"
  external_label: "Open separately"
  external_menu_label: "LINKS"
  external_menu_subtitle: "Outside"
  external_menu_heading: "External Links"
  navigation_label: "News sections"
  frame_title: "Daily brief"
  no_post_before: "No individual post was discovered for"
  open_archive_text: "Open its archive"
  open_external_text: "Open directly"
  cannot_embed_text: "This source blocks iframe display in browsers."
  data_error_text: "Portal data could not be read. Run the included GitHub Action once."

  # Badge behaviour: "time" shows only the latest fetch time, e.g. 10:00 PM.
  # Other supported values are "label_time" and "label".
  latest_badge_mode: "time"
  latest_label: "Latest"

# Add, remove, rename, disable or reorder menu buttons here.
sources:
  - id: "pib"
    enabled: true
    label: "PIB"
    subtitle: "Government"
    heading: "PIB Brief"
    archive: "https://rajeshphy.github.io/pib/"
    github_repo: "rajeshphy/pib"
    posts_dir: "_posts"
    branch: "main"

  - id: "dmk"
    enabled: true
    label: "DMK"
    subtitle: "Local"
    heading: "Dumka Brief"
    archive: "https://rajeshphy.github.io/dumka-jhar-news/"
